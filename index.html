<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Experience the Museum of the Future - An immersive 3D journey through art and history">
  <title>Museum of the Future | 3D Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: 120px;
      height: 120px;
      border: 3px solid rgba(0, 255, 255, 0.1);
      border-top-color: #00ffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      position: relative;
    }

    .loader::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      border: 3px solid rgba(255, 0, 255, 0.1);
      border-top-color: #ff00ff;
      border-radius: 50%;
      animation: spin 1.5s linear infinite reverse;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 30px;
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 2s linear infinite;
    }

    .loading-progress {
      margin-top: 15px;
      font-size: 14px;
      color: #888;
    }

    @keyframes shimmer {
      to { background-position: 200% center; }
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
    }

    #ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    .ui-panel {
      pointer-events: auto;
    }

    #hud {
      position: absolute;
      top: 30px;
      left: 30px;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      color: #00ffff;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }

    #room-info {
      position: absolute;
      top: 30px;
      right: 30px;
      text-align: right;
      font-family: 'Orbitron', sans-serif;
    }

    .room-name {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(90deg, #00ffff, #ff00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .room-description {
      font-size: 14px;
      color: #888;
      max-width: 300px;
    }

    #controls-hint {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 10px;
      font-size: 14px;
      backdrop-filter: blur(10px);
    }

    .control-item {
      display: inline-block;
      margin: 0 15px;
      color: #aaa;
    }

    .control-key {
      color: #00ffff;
      font-weight: 600;
      font-family: 'Orbitron', sans-serif;
    }

    #artifact-info {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 500px;
      padding: 25px 35px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid rgba(255, 0, 255, 0.5);
      border-radius: 15px;
      backdrop-filter: blur(15px);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    #artifact-info.visible {
      opacity: 1;
    }

    .artifact-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #ff00ff;
      margin-bottom: 10px;
    }

    .artifact-description {
      font-size: 15px;
      line-height: 1.6;
      color: #ccc;
    }

    #navigation-menu {
      position: absolute;
      top: 50%;
      left: 30px;
      transform: translateY(-50%);
      padding: 20px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 10px;
      backdrop-filter: blur(10px);
    }

    .nav-button {
      display: block;
      width: 200px;
      padding: 15px;
      margin: 10px 0;
      background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
      border: 1px solid rgba(0, 255, 255, 0.5);
      border-radius: 8px;
      color: #00ffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .nav-button:hover {
      background: linear-gradient(135deg, rgba(0, 255, 255, 0.3), rgba(255, 0, 255, 0.3));
      transform: translateX(5px);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
    }

    .nav-button.active {
      background: linear-gradient(135deg, rgba(0, 255, 255, 0.4), rgba(255, 0, 255, 0.4));
      border-color: #ff00ff;
    }

    @media (max-width: 768px) {
      #hud, #room-info {
        font-size: 12px;
        top: 15px;
        left: 15px;
        right: 15px;
      }

      .room-name {
        font-size: 20px;
      }

      #navigation-menu {
        left: 50%;
        transform: translate(-50%, -50%);
        top: 50%;
      }

      #controls-hint {
        font-size: 12px;
        bottom: 15px;
      }

      .control-item {
        display: block;
        margin: 5px 0;
      }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loader"></div>
    <div class="loading-text">MUSEUM OF THE FUTURE</div>
    <div class="loading-progress">Initializing Experience...</div>
  </div>

  <div id="canvas-container"></div>

  <div id="ui-overlay">
    <div id="hud" class="ui-panel">
      <div>SYSTEM: ONLINE</div>
      <div>VISITORS: <span id="visitor-count">--</span></div>
    </div>

    <div id="room-info" class="ui-panel">
      <div class="room-name" id="current-room-name">Welcome Hall</div>
      <div class="room-description" id="current-room-description">
        Begin your journey through time and space
      </div>
    </div>

    <div id="navigation-menu" class="ui-panel">
      <button class="nav-button active" data-room="entrance">Entrance Hall</button>
      <button class="nav-button" data-room="ancient">Ancient Civilizations</button>
      <button class="nav-button" data-room="renaissance">Renaissance Gallery</button>
      <button class="nav-button" data-room="modern">Modern Art Wing</button>
      <button class="nav-button" data-room="future">Future Visions</button>
    </div>

    <div id="controls-hint" class="ui-panel">
      <span class="control-item"><span class="control-key">WASD</span> Move</span>
      <span class="control-item"><span class="control-key">MOUSE</span> Look</span>
      <span class="control-item"><span class="control-key">SHIFT</span> Run</span>
      <span class="control-item"><span class="control-key">CLICK</span> Interact</span>
    </div>

    <div id="artifact-info" class="ui-panel">
      <div class="artifact-title" id="artifact-title"></div>
      <div class="artifact-description" id="artifact-description"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
